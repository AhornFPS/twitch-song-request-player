name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Scan introduced commits without printing credentials
        run: node scripts/check-secrets.mjs --ci
        env:
          SECRET_SCAN_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          SECRET_SCAN_HEAD: ${{ github.sha }}
          SECRET_SCAN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Test secret checks
        run: |
          npm ci --ignore-scripts
          node --import tsx --test scripts/check-secrets.test.ts
